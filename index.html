<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>P・SPO 店舗マップ＆ナビ | クランクベンチ・スタディroom検索</title>
  
  <!-- Apple / iOS CarPlay 最適化メタタグ -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="P・SPOナビ">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="assets/logo.png">
  
  <!-- Leaflet CSS (Local Vendor) -->
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  
  <!-- App Style -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app" class="app-layout">
    
    <!-- Top Header -->
    <header class="app-header">
      <div class="header-inner">
        <div class="brand">
          <img src="assets/logo.png" alt="P・SPO Logo" class="brand-logo" onerror="this.style.display='none'">
          <div class="brand-text">
            <h1 class="brand-title">P・SPO 店舗ナビ</h1>
          </div>
        </div>
        <div class="header-actions">
          <a href="https://pspo24.hacomono.jp/app/login?_gl=1*slop4d*_gcl_au*NTg5MDM2NDY1LjE3OTE3ODAzNjU.*_ga*MTEyNDY5OTcwLjE3OTE3ODAzNjY.*_ga_RJ405SZ292*czE3OTE3ODc5MDgkbzIkZzAkdDE3OTE3ODc5MDgkajYwJGwwJGgw"
             class="btn-action btn-mypage"
             target="_blank"
             rel="noopener"
             title="P・SPO 会員マイページ（ログイン・予約・会員証）">
            <span class="icon">👤</span>
            <span class="btn-text">マイページ</span>
          </a>
          <button id="btn-open-quiz" class="btn-action btn-quiz" type="button" title="PSPO検定 対策クイズ（100問）">
            <span class="icon">🏆</span>
            <span class="btn-text">検定対策<br>クイズ</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Quick Filter Bar (Sticky Horizontal Filter) -->
    <div class="quick-filter-bar">
      <div class="quick-filter-scroll">
        <button class="quick-btn active" data-quick="all">
          <span class="q-icon">🏢</span> 全店舗 (<span id="count-all">0</span>)
        </button>
        <button class="quick-btn q-fav" data-quick="fav">
          <span class="q-icon">⭐</span> お気に入り (<span id="count-fav">0</span>)
        </button>
        <button class="quick-btn q-office" data-quick="office">
          <span class="q-icon">💼</span> オフィス・登記 (<span id="count-office">0</span>)
        </button>
        <button class="quick-btn q-crunch" data-quick="crunch">
          <span class="q-icon">🏋️‍♂️</span> クランクベンチ (<span id="count-crunch">0</span>)
        </button>
        <button class="quick-btn q-study" data-quick="study">
          <span class="q-icon">📖</span> スタディROOM (<span id="count-study">0</span>)
        </button>
        <button class="quick-btn q-sauna" data-quick="sauna">
          <span class="q-icon">♨️</span> サウナ・温泉 (<span id="count-sauna">0</span>)
        </button>
        <button class="quick-btn q-esthe" data-quick="esthe">
          <span class="q-icon">💆‍♀️</span> セルフエステ (<span id="count-esthe">0</span>)
        </button>
        <button class="quick-btn q-tennis" data-quick="tennis">
          <span class="q-icon">🎾</span> テニス (<span id="count-tennis">0</span>)
        </button>
        <button class="quick-btn q-boulder" data-quick="boulder">
          <span class="q-icon">🧗</span> ボルダリング (<span id="count-boulder">0</span>)
        </button>
        <button class="quick-btn q-cafe" data-quick="cafe">
          <span class="q-icon">☕</span> カフェ (<span id="count-cafe">0</span>)
        </button>
      </div>
    </div>

    <!-- Main Container -->
    <div class="main-container">
      
      <!-- Side / List Panel -->
      <aside class="list-panel" id="list-panel">
        
        <!-- Filter Controls -->
        <div class="filter-box">
          <div class="search-input-wrapper">
            <span class="search-icon">🔍</span>
            <input type="text" id="keyword-search" placeholder="店舗名、地域、設備で検索..." autocomplete="off">
            <button id="btn-clear-search" class="btn-clear" style="display:none;">✕</button>
          </div>

          <div class="filter-row">
            <div class="select-group">
              <label for="area-select">エリア:</label>
              <select id="area-select">
                <option value="all">すべてのエリア (愛媛・他)</option>
                <option value="matsuyama">松山エリア</option>
                <option value="toon">東温エリア</option>
                <option value="tobe">砥部エリア</option>
                <option value="imabari">今治・しまなみエリア</option>
                <option value="saijo_niihama">西条・新居浜エリア</option>
                <option value="nanyo">大洲・南予エリア</option>
                <option value="other">愛知県・北海道</option>
              </select>
            </div>

            <div class="select-group">
              <label for="sort-select">並び替え:</label>
              <select id="sort-select">
                <option value="default">標準（エリア順）</option>
                <option value="distance">現在地から近い順</option>
                <option value="name">店舗名五十音順</option>
              </select>
            </div>
          </div>

          <!-- Feature Tag Pills -->
          <div class="feature-pills">
            <button class="pill-btn" data-feature="office">
              <span class="pill-dot office"></span>法人登記・オフィス
            </button>
            <button class="pill-btn" data-feature="has_crunch_bench">
              <span class="pill-dot crunch"></span>クランクベンチ
            </button>
            <button class="pill-btn" data-feature="has_study_room">
              <span class="pill-dot study"></span>スタディroom
            </button>
            <button class="pill-btn" data-feature="gym">
              <span class="pill-dot gym"></span>ジム設備
            </button>
            <button class="pill-btn" data-feature="esthe">
              <span class="pill-dot esthe"></span>セルフエステ
            </button>
            <button class="pill-btn" data-feature="sauna">
              <span class="pill-dot sauna"></span>サウナ・温泉
            </button>
            <button class="pill-btn" data-feature="tennis">
              <span class="pill-dot tennis"></span>テニス
            </button>
            <button class="pill-btn" data-feature="boulder">
              <span class="pill-dot boulder"></span>ボルダリング
            </button>
            <button class="pill-btn" data-feature="staffed">
              <span class="pill-dot staffed"></span>有人店舗
            </button>
          </div>
        </div>

        <!-- Result Status & Notice -->
        <div class="result-status">
          <div class="status-left">
            検索結果: <strong id="matched-count">0</strong> 店舗
          </div>
          <div class="status-right" id="active-filter-indicator"></div>
        </div>

        <!-- Feature Spotlight Banner (shown when filtered by crunch or study) -->
        <div id="spotlight-banner" class="spotlight-banner" style="display:none;"></div>

        <!-- Store List Container -->
        <div class="stores-scroll-list" id="stores-list">
          <!-- Cards rendered by JS -->
        </div>
      </aside>

      <!-- Map Panel -->
      <main class="map-panel" id="map-panel">
        <div id="map-view" class="map-view"></div>

        <!-- Floating Map Overlay Controls -->
        <div class="map-floating-controls">
          <button id="btn-recenter-ehime" class="float-btn" title="愛媛県全体を表示">
            🍊 愛媛県全体
          </button>
          <button id="btn-recenter-matsuyama" class="float-btn" title="松山市中心部を表示">
            🏯 松山市内
          </button>
          <button id="btn-map-locate" class="float-btn float-locate" title="現在地へ移動">
            📍 現在地
          </button>
          <button id="btn-scroll-to-list" class="float-btn float-scroll-down" title="店舗一覧へスクロール">
            👇 店舗一覧へ
          </button>
        </div>

        <!-- Bottom Sheet Preview for Mobile Map View -->
        <div id="mobile-preview-card" class="mobile-preview-card" style="display: none;">
          <button id="btn-close-preview" class="btn-close-preview">✕</button>
          <div id="preview-content"></div>
        </div>
      </main>

    </div>

    <!-- Mobile Bottom Navigation Bar -->
    <nav class="mobile-nav">
      <button class="nav-item" id="nav-btn-map">
        <span class="nav-icon">🗺️</span>
        <span class="nav-label">マップへ</span>
      </button>
      <button class="nav-item q-fav-nav" id="nav-btn-fav">
        <span class="nav-icon">⭐</span>
        <span class="nav-label">お気に入り</span>
      </button>
      <button class="nav-item q-crunch-nav" id="nav-btn-crunch">
        <span class="nav-icon">🏋️‍♂️</span>
        <span class="nav-label">クランク</span>
      </button>
      <button class="nav-item q-study-nav" id="nav-btn-study">
        <span class="nav-icon">📖</span>
        <span class="nav-label">スタディ</span>
      </button>
      <button class="nav-item" id="nav-btn-nearby">
        <span class="nav-icon">📍</span>
        <span class="nav-label">現在地</span>
      </button>
    </nav>

  </div>

  <!-- Detail Modal -->
  <div id="store-modal" class="modal-overlay" style="display:none;">
    <div class="modal-card">
      <button id="btn-modal-close" class="modal-close">✕</button>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <!-- PSPO Exam Quiz Modal -->
  <div id="quiz-modal" class="modal-overlay" style="display:none;">
    <div class="modal-card quiz-modal-card">
      <!-- Header -->
      <div class="quiz-header-bar">
        <div class="quiz-header-info">
          <span class="quiz-header-icon">🏆</span>
          <div>
            <h3 class="quiz-header-title">PSPO検定 対策クイズ</h3>
            <span class="quiz-header-sub">目指せ全問正解！1年分会費無料を勝ち取ろう</span>
          </div>
        </div>
        <button id="btn-quiz-close" class="quiz-close-btn" type="button" title="閉じる">✕</button>
      </div>

      <!-- Mode Selection Tabs -->
      <div class="quiz-mode-tabs">
        <button class="quiz-tab-btn active" data-tab="exam">📝 模擬検定 (10問)</button>
        <button class="quiz-tab-btn" data-tab="genres">🎯 ジャンル別攻略</button>
        <button class="quiz-tab-btn" data-tab="archive">📖 100問完全問題集</button>
      </div>

      <!-- Quiz Body Content -->
      <div id="quiz-body-container" class="quiz-body">
        <!-- Rendered dynamically by app.js -->
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="js/data.js"></script>
  <script src="js/quiz_data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
